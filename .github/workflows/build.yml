name: Build & Release «Хроніки Дивосвіту»

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Check whether this version is already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      # electron-builder creates the GitHub release v<version> with the .exe files and latest.yml (needed for auto-update)
      - name: Build (and publish new version)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ steps.ver.outputs.exists }}" = "true" ]; then P=never; else P=always; fi
          npx electron-builder --win portable nsis --x64 --publish $P
      - uses: actions/upload-artifact@v4
        with:
          name: Dyvosvit-Windows
          path: |
            dist/Dyvosvit-Portable-*.exe
            dist/Dyvosvit-Setup-*.exe
            dist/latest.yml
